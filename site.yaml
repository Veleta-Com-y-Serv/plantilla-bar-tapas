    cta: { texto: Reservar por WhatsApp, url: "https://wa.me/34600000000?text=Hola%2C%20quiero%20reservar%20para%20un%20grupo" }
    cta_secundario: { texto: Llamar al bar, url: "tel:941000000" }
    nota: "Entre semana, si venís menos de seis, no hace falta reservar."

  horario-ubicacion:
    activa: true
    antetitulo: Ven a vernos
    titulo: Horario y dónde estamos.
    texto: "En plena calle del Laurel, a dos minutos del paseo del Espolón. Aparcamiento público en la plaza del Ayuntamiento."
    imagen: /fotos/fachada.jpg
    mapa: true
    horario:
      - { dia: Lunes, horas: Cerrado }
      - { dia: Martes a jueves, horas: "9:00 a 23:30" }
      - { dia: Viernes y sábado, horas: "9:00 a 1:00" }
      - { dia: Domingo, horas: "11:00 a 16:00" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir.
    preguntas:
      - { pregunta: "¿Ponéis tapa con la consumición?", respuesta: "Sí. Con cada caña, vino o refresco te ponemos una tapa de la casa, que cambia cada día." }
      - { pregunta: "¿Hace falta reservar?", respuesta: "Para tomar algo en la barra o en la terraza, no. Para grupos de más de seis o para cenar el fin de semana, mejor llamar antes." }
      - { pregunta: "¿Tenéis opciones sin gluten?", respuesta: "Varias tapas y raciones se pueden preparar sin gluten y tenemos pan sin gluten. Avísanos al pedir." }
      - { pregunta: "¿Echáis el fútbol?", respuesta: "Sí, todos los partidos de liga y de copa, en la tele de la barra y con sonido." }
      - { pregunta: "¿Se puede ir con niños o con perro?", respuesta: "Con niños, claro: tenemos tronas. Los perros son bienvenidos en la terraza." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Llámanos o escríbenos.
    texto: "Reservas de grupo, encargos o cualquier pregunta. Te contestamos el mismo día."
