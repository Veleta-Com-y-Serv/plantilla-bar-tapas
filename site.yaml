  sobre:
    activa: true
    antetitulo: El bar
    titulo: Un bar de barrio desde 1987.
    declaracion: "Aquí se viene a tomar algo, a ver el partido y a charlar en la barra."
    texto: |
      Casa Tino lo abrió el padre de Marta en una esquina de la calle del Laurel. Hoy lo lleva ella, con la misma barra de madera y la misma salsa brava.

      La cocina es casera y de siempre: lo que sale cada día se hace esa mañana. Entre semana viene la gente del barrio; los fines de semana, cuadrillas de toda la ciudad.
    imagen: /fotos/sobre.jpg
    items:
      - { titulo: Cocina casera, texto: "Croquetas, bravas y tortilla hechas aquí cada mañana." }
      - { titulo: Barra y terraza, texto: "Barra larga dentro y barriles en la calle para tomar algo de pie." }
      - { titulo: Para todos, texto: "Vienen familias, cuadrillas y vecinos de toda la vida." }

  momentos:
    activa: true
    antetitulo: Un plan para cada hora
    titulo: Del almuerzo a la última.
    texto: "Abrimos a las nueve y la cocina no cierra hasta las once de la noche."
    momentos:
      - { cuando: "De 9:00 a 12:00", titulo: Almuerzos, texto: "Bocadillo, tortilla o huevos con chorizo, con su vino o su café." }
      - { cuando: "De 12:00 a 15:00", titulo: Vermut, texto: "De grifo, con su aceituna y su naranja, y unas patatas para picar." }
      - { cuando: Días de partido, titulo: Fútbol, texto: "Todos los partidos en la tele grande de la barra, con sonido." }
      - { cuando: Viernes y sábados, titulo: Cenas de grupo, texto: "Raciones al centro para cuadrillas, cumpleaños y despedidas." }

  galeria:
